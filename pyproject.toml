[tool.poetry]
name = "water-potability-ml"
version = "0.1.0"
description = "Projeto de classificação de potabilidade de água com MLflow e MLOps"
authors = ["Seu Nome <seu@email.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.1.0"
scikit-learn = "^1.3.0"
mlflow = "^2.8.0"
pydantic = "^2.4.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"
pytest = "^7.4.0"
pre-commit = "^3.5.0"
bump2version = "^1.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"] # Erros, Warnings e Ordenação de Imports